<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TermDock Desktop</title>
<link rel="icon" href="data:,">
<style>
  html, body { height: 100%; margin: 0; background: #000; overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  #bar { display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 12px;
    background: #161b22; border-bottom: 1px solid #2d333b; color: #e6edf3; font-size: 13px; }
  #name { color: #8b949e; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #role-badge { font-size: 11px; padding: 2px 8px; border-radius: 10px; background: #21262d; color: #8b949e; }
  #role-badge.viewer { background: #1c2b1c; color: #7ee787; }
  #wrap { position: absolute; top: 34px; left: 0; right: 0; bottom: 0; }
  .desktop-view { position: relative; width: 100%; height: 100%; background: #000; }
  .desktop-screen { position: absolute; inset: 0; }
  .desktop-screen canvas { display: block; margin: 0 auto; max-width: 100%; max-height: 100%; }
  .desktop-overlay { position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 12px;
    background: rgba(0,0,0,0.7); color: #8b949e; font-size: 14px; }
  .desktop-reconnect { background: #1f6feb; border: none; color: #fff; border-radius: 6px;
    padding: 8px 16px; font-size: 13px; cursor: pointer; }
  .desktop-reconnect:hover { background: #388bfd; }
</style>
</head>
<body>
<div id="bar"><span>&#128421;&#65039;</span><span id="name">Desktop</span><span id="role-badge"></span></div>
<div id="wrap"></div>
<script type="module">
import { DesktopViewer } from '/desktop.js';
const parts = location.pathname.split('/');
const sessionId = decodeURIComponent(parts[parts.length - 1] || '');
const wrap = document.getElementById('wrap');
const nameEl = document.getElementById('name');
const badge = document.getElementById('role-badge');
let viewer = null;

async function init() {
  let sess;
  try {
    const r = await fetch('/api/sessions/' + encodeURIComponent(sessionId));
    if (!r.ok) { nameEl.textContent = 'Session not found'; return; }
    sess = await r.json();
  } catch (e) { nameEl.textContent = 'Failed to load session'; return; }
  if (sess.display !== 'desktop') { nameEl.textContent = 'Not a desktop session'; return; }
  nameEl.textContent = sess.name || 'Desktop';
  const role = sess.my_role || 'owner';
  if (role === 'viewer') { badge.textContent = 'viewer · watch only'; badge.className = 'viewer'; badge.id = 'role-badge'; }
  else if (role) { badge.textContent = role; }
  document.title = 'TermDock — ' + (sess.name || 'Desktop');
  viewer = new DesktopViewer(wrap, sessionId, role);
  viewer.connect();
  // Poll until the session is running, then connect the VNC stream.
  if (sess.status !== 'running') {
    const t = setInterval(async () => {
      try {
        const r2 = await fetch('/api/sessions/' + encodeURIComponent(sessionId));
        const s2 = await r2.json();
        if (s2.status === 'running') { clearInterval(t); viewer.connect(); }
        else if (s2.status === 'error') { clearInterval(t); nameEl.textContent = 'Error: ' + (s2.status_msg || ''); }
      } catch (e) { /* keep polling */ }
    }, 2000);
  }
}
init();
window.addEventListener('beforeunload', () => { if (viewer) viewer.destroy(); });
</script>
</body>
</html>
