<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TermDock</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/vendor/xterm.min.css">
<script src="/vendor/xterm.min.js"></script>
<script src="/vendor/xterm-addon-fit.min.js"></script>
<script src="/vendor/xterm-addon-webgl.min.js"></script>
<style>
  html, body { height: 100%; margin: 0; background: #000; overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  #bar { display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 12px;
    background: #161b22; border-bottom: 1px solid #2d333b; color: #e6edf3; font-size: 13px; }
  #name { color: #8b949e; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #tabbar { display: flex; align-items: center; gap: 6px; padding: 6px 12px;
    background: #0d1117; border-bottom: 1px solid #2d333b; overflow-x: auto; }
  .ptab { display: flex; align-items: center; gap: 8px; padding: 5px 8px 5px 12px;
    background: #161b22; border: 1px solid #2d333b; border-radius: 8px;
    color: #e6edf3; font-size: 12px; cursor: pointer; white-space: nowrap; }
  .ptab.active { border-color: #1f6feb; }
  .ptab .tab-badge:empty { display: none; }
  .ptab .px { background: none; border: none; color: #8b949e; cursor: pointer;
    font-size: 14px; line-height: 1; padding: 0 2px; }
  .ptab .px:hover { color: #f85149; }
  #padd { background: none; border: 1px dashed #2d333b; border-radius: 8px;
    color: #8b949e; cursor: pointer; font-size: 14px; padding: 4px 10px; }
  #padd:hover { color: #1f6feb; border-color: #1f6feb; }
  #panes { height: calc(100% - 34px - 45px); position: relative; }
  .term-pane { position: absolute; inset: 0; display: none; }
  .term-pane.active { display: block; }
  .term-pane .xterm { height: 100%; padding: 4px; }
  .td-badge { font-size: 12px; padding: 3px 10px; border-radius: 12px;
    border: 1px solid #2d333b; background: #1c2330; color: #8b949e; white-space: nowrap; }
  .td-badge.td-running { color: #3fb950; border-color: #3fb950; animation: tdpulse 1.2s infinite; }
  .td-badge.td-exit-bad { color: #f85149; border-color: #f85149; }
  .td-badge.td-exit-ok { color: #3fb950; border-color: #3fb950; }
  @keyframes tdpulse { 50% { opacity: 0.45; } }
  #fatal { display: none; color: #e6edf3; padding: 40px; text-align: center; }
  #empty { display: none; color: #8b949e; padding: 40px; text-align: center; }
  #empty button { margin-top: 12px; }
</style>
</head>
<body>
<div id="bar"><span id="name"></span></div>
<div id="tabbar"></div>
<div id="panes"></div>
<div id="empty"><div>No terminal open.</div><button id="reopen">Open main terminal</button></div>
<div id="fatal"></div>
<script type="module">
import { TermDockTerminal } from '/terminal.js';

const sessionId = location.pathname.split('/').filter(Boolean).pop();
const initialTerm = new URLSearchParams(location.search).get('term') || 'main';

async function api(method, path, body) {
  const opts = { method, credentials: 'same-origin', headers: {} };
  if (body !== undefined) {
    opts.headers['Content-Type'] = 'application/json';
    opts.body = JSON.stringify(body);
  }
  let res;
  try { res = await fetch(path, opts); }
  catch (e) { return { ok: false, status: 0, data: { error: 'network error' } }; }
  let data = null;
  try { data = await res.json(); } catch (e) { /* empty */ }
  return { ok: res.ok, status: res.status, data };
}

function fatal(msg) {
  document.getElementById('bar').style.display = 'none';
  document.getElementById('tabbar').style.display = 'none';
  document.getElementById('panes').style.display = 'none';
  const el = document.getElementById('fatal');
  el.style.display = 'block';
  el.textContent = msg;
}

let sessionName = 'terminal';
let myRole = null;
const tabs = new Map(); // termId -> {termId, seq, tabEl, paneEl, badgeEl, tterm, active}

function labelFor(seq) {
  return seq === 1 ? sessionName : `${sessionName} (${seq})`;
}

function renderLabel(tab) {
  tab.labelEl.textContent = labelFor(tab.seq) + (tab.viewOnly ? ' (view only)' : '');
}

// Keep the tab strip ordered by seq, before the "+" button.
function positionTab(tab) {
  const bar = document.getElementById('tabbar');
  const addBtn = document.getElementById('padd');
  const after = [...bar.querySelectorAll('.ptab')].find((el) => {
    if (el === tab.tabEl) return false;
    const other = [...tabs.values()].find((t) => t.tabEl === el);
    return other && other.seq > tab.seq;
  });
  bar.insertBefore(tab.tabEl, after || addBtn || null);
}

function addTab(termId, seq) {
  if (tabs.has(termId)) return tabs.get(termId);

  const tabEl = document.createElement('button');
  tabEl.className = 'ptab';
  const badgeEl = document.createElement('span');
  badgeEl.className = 'tab-badge';
  const labelEl = document.createElement('span');
  labelEl.textContent = labelFor(seq);
  const x = document.createElement('span');
  x.className = 'px';
  x.textContent = '×';
  x.title = 'Close tab';
  tabEl.append(badgeEl, labelEl, x);

  const paneEl = document.createElement('div');
  paneEl.className = 'term-pane';
  document.getElementById('panes').appendChild(paneEl);

  const tab = { termId, seq, tabEl, labelEl, paneEl, badgeEl, tterm: null, active: false, viewOnly: false };
  tabs.set(termId, tab);

  tabEl.onclick = (e) => {
    if (e.target === x) closeTab(termId);
    else activateTab(termId);
  };
  renderLabel(tab);
  positionTab(tab);
  return tab;
}

function activateTab(termId) {
  for (const [id, t] of tabs) {
    const active = id === termId;
    t.active = active;
    t.tabEl.classList.toggle('active', active);
    t.paneEl.classList.toggle('active', active);
    if (active) {
      if (!t.tterm) openTerminal(t);
      else setTimeout(() => t.tterm.refit(), 30);
      document.title = `${t.labelEl.textContent} — TermDock`;
    }
  }
}

function openTerminal(tab) {
  const t = new TermDockTerminal({
    sessionId,
    termId: tab.termId,
    api,
    updateTitle: false,
    notify: (msg) => console.log('[termdock]', msg),
    onRole: (role) => {
      if (role === 'viewer') { tab.viewOnly = true; renderLabel(tab); }
      refreshTerms(); // role arrives right after attach; pick up the real seq
    },
    onTermClosed: () => closeTab(tab.termId), // ephemeral shell exited
  });
  tab.tterm = t;
  t.open(tab.paneEl, tab.badgeEl).catch((e) => {
    tab.paneEl.innerHTML = `<div style="padding:24px;color:#f85149">Couldn't open the terminal view: ${(e && e.message) || e}</div>`;
  });
  window.addEventListener('resize', () => t.refit());
}

// Closing detaches; the main shell keeps running, an extra shell is torn
// down once its last viewer leaves.
function closeTab(termId) {
  const tab = tabs.get(termId);
  if (!tab) return;
  if (tab.tterm) tab.tterm.close();
  tab.tabEl.remove();
  tab.paneEl.remove();
  tabs.delete(termId);
  if (!tabs.size) {
    document.getElementById('empty').style.display = 'block';
  } else if (tab.active) {
    activateTab([...tabs.keys()][0]);
  }
}

function newTerminal() {
  if (myRole === 'viewer') return;
  const termId = 't-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  // Attach first so the server assigns a seq, then pick up the real label.
  const tab = addTab(termId, 99);
  activateTab(termId);
  refreshTerms();
}

let lastTerms = [];
async function refreshTerms() {
  const r = await api('GET', `/api/sessions/${sessionId}/terms`);
  if (!r.ok) return;
  lastTerms = (r.data.terms || []).slice().sort((a, b) => a.seq - b.seq);
  // The main terminal always gets a tab (attaching creates it server-side).
  if (!lastTerms.some((t) => t.id === 'main')) lastTerms.unshift({ id: 'main', seq: 1 });
  for (const t of lastTerms) {
    if (myRole === 'viewer' && t.id !== 'main') continue;
    const tab = addTab(t.id, t.seq);
    if (tab.seq !== t.seq) {
      tab.seq = t.seq;
      renderLabel(tab);
      positionTab(tab);
    }
  }
}

const r = await api('GET', `/api/sessions/${sessionId}`);
if (r.status === 401) {
  fatal('Not signed in. Log in via the TermDock dashboard, then reopen this window.');
} else if (!r.ok) {
  fatal('Could not load terminal: ' + ((r.data && r.data.error) || 'unknown error'));
} else {
  sessionName = r.data.name || sessionName;
  myRole = r.data.my_role || null;
  document.getElementById('name').textContent = sessionName + (myRole === 'viewer' ? ' (view only)' : '');

  const bar = document.getElementById('tabbar');
  if (myRole !== 'viewer') {
    const add = document.createElement('button');
    add.id = 'padd';
    add.textContent = '+';
    add.title = 'New terminal in this container';
    add.onclick = () => newTerminal();
    bar.appendChild(add);
  }

  document.getElementById('reopen').onclick = () => {
    document.getElementById('empty').style.display = 'none';
    addTab('main', 1);
    activateTab('main');
  };

  await refreshTerms();
  // Open the requested terminal (or main); others stay listed in the tab bar.
  const target = [...tabs.keys()].includes(initialTerm) ? initialTerm : 'main';
  if (!tabs.has(target)) addTab(target, target === 'main' ? 1 : 99);
  activateTab(target);
  document.getElementById('empty').style.display = 'none';

  // Pick up terminals opened elsewhere (e.g. the dashboard's "+" button).
  setInterval(refreshTerms, 5000);
  window.addEventListener('beforeunload', () => {
    for (const t of tabs.values()) if (t.tterm) t.tterm.close();
  });
}
</script>
</body>
</html>
