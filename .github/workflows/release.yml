name: release

# Builds the TermDock binary and attaches it to the GitHub release page.
#
# How to cut a release:
#   git tag v0.1.0 && git push origin v0.1.0
# The workflow builds termdock for linux/amd64 (fully static, CGO disabled),
# generates SHA256SUMS.txt, and uploads both as release assets.
#
# "Build binary" (workflow_dispatch / any branch push) runs the same
# compile + vet + tests as a smoke check without publishing.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write # needed to create the release and upload assets

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build termdock (linux/amd64, static)
        run: |
          CGO_ENABLED=0 go build -trimpath -o dist/termdock-linux-amd64 ./cmd/termdock
          chmod +x dist/termdock-linux-amd64

      - name: Checksums
        run: |
          cd dist
          sha256sum termdock-linux-amd64 > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/termdock-linux-amd64
            dist/SHA256SUMS.txt
          generate_release_notes: true
